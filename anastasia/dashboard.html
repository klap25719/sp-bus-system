<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saint-Paul | Πίνακας Ελέγχου</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #fdfd96; background-image: none;">

    <div id="sidebar" class="sidebar" style="width: 300px;">
    <button id="close-btn" class="close-btn">&times;</button>
    
    <!-- Εδώ θα εμφανίζονται οι επιλογές του ρόλου -->
    <div id="dynamic-menu" class="menu-section">
        <h4 id="menu-title"></h4>
        <ul id="menu-list">
            <!-- Τα <li><a> θα μπουν εδώ από τη JS -->
        </ul>
    </div>

    <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 20px 0;">
    <a href="index.html" class="menu-item"><i class="fas fa-home"></i> Επιστροφή στην Αρχική</a>
    </div>

    <!-- Κουμπί για να ξανανοίγει το μενού (Menu Toggle) -->
    <button id="menu-toggle" class="menu-toggle">
    <i class="fas fa-bars"></i>
    </button>

    <button id="menu-toggle" class="menu-btn" style="display:none;"><i class="fas fa-bars"></i> Μενού</button>

    <main id="main-content" style="margin-left: 320px; transition: 0.5s; padding: 40px; text-align: left;">
        <h2 style="color: #0047ab;">Πίνακας Διαχείρισης</h2>
        <p>Επιλέξτε μια ενέργεια από το πλευρικό μενού για να συνεχίσετε.</p>
    </main>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');

    const sidebar = document.getElementById("sidebar");
    const menuToggle = document.getElementById("menu-toggle");
    const menuList = document.getElementById('menu-list');
    const menuTitle = document.getElementById('menu-title');
    const mainContent = document.getElementById("main-content");
    const closeBtn = document.getElementById("close-btn");

    const roleData = {
        'parents': { title: 'Γονείς', items: ['Δήλωση απουσίας', 'Τροποποίηση απουσίας'] },
        'office': { title: 'Γραφείο Κίνησης', items: ['Τακτικά δρομολόγια', 'Δηλώσεις απουσιών', 'Προβολή & Τροποποίηση', 'Έλεγχος & Οριστικοποίηση'] },
        'director': { title: 'Διευθυντής', items: ['Προβολή στατιστικών', 'Κατάσταση δρομολογίων'] }
    };

    // ΠΕΡΙΠΤΩΣΗ ΟΔΗΓΩΝ
   if (role === 'drivers') {
    if(sidebar) sidebar.remove();
    if(menuToggle) menuToggle.remove();
    
    //Σπρώχνουμε το περιεχόμενο αρκετά κάτω για να χωρέσει το κουμπί από πάνω
    mainContent.style.setProperty('padding-top', '120px', 'important');
    mainContent.style.setProperty('padding-left', '20px', 'important');
    mainContent.style.marginLeft = "20px";

    //Φτιάχνουμε το κουμπί
    const backBtn = document.createElement('a');
    backBtn.href = "index.html";
    backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Επιστροφή στην Αρχική';
    
    backBtn.style.cssText = `
        position: fixed; 
        top: 20px; 
        left: 20px; 
        background: #0047ab; 
        color: white; 
        padding: 10px 20px; 
        border-radius: 5px; 
        text-decoration: none; 
        z-index: 10000; 
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    `;
    document.body.appendChild(backBtn);
}
    // ΥΠΟΛΟΙΠΟΙ ΡΟΛΟΙ
    else if (roleData[role]) {
        menuTitle.innerHTML = `<i class="fas fa-bars"></i> ${roleData[role].title}`;
        
        roleData[role].items.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="#" class="menu-item">${item}</a>`;
            menuList.appendChild(li);
        });

        // Λειτουργία Sidebar (X και Hamburger)
        closeBtn.onclick = () => {
            sidebar.style.width = "0";
            mainContent.style.marginLeft = "20px";
            menuToggle.style.display = "block";
        };

        menuToggle.onclick = () => {
            sidebar.style.width = "300px";
            mainContent.style.marginLeft = "320px";
            menuToggle.style.display = "none";
        };
    }
</script>
</body>
</html>
