<!DOCTYPE html>
<html lang="el">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Καθορισμός Δρομολογίων - Σχολικός Στόλος</title>
        <link rel="stylesheet" href="dromologia.css">
    </head>

    <body>
        <div class="container">
            <h1>🚍 Καθορισμός Δρομολογίων</h1>

            <div class="grid">
                <div class="panel">
                    <h3>📋 1. Λίστα Μαθητών</h3>
                    <input type="text" id="routeName" placeholder="✏️ Όνομα Δρομολογίου (π.χ. Saint Paul - Ίλιον)"> 
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchStudent" placeholder="Αναζήτηση μαθητή...">
                    </div>
                    <div class="list" id="studentList"></div>
                    <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                        <span class="selection-info" id="selectionInfo">0 επιλεγμένοι</span>
                        <button class="primary" onclick="confirmSelection()">✅ Επιβεβαίωση</button>
                    </div>
                </div>

                <div class="panel">
                    <h3>👥 2. Επιλεγμένο Δρομολόγιο</h3>
                    <div class="list" id="selectedList" style="min-height:180px;"></div>
                    <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;">
                        <button class="success" onclick="saveRoute()">💾 Καταχώρηση</button>
                        <button class="info" onclick="editSelectedRoute()">✏️ Τροποποίηση</button>
                        <button class="gray" onclick="newRoute()">🆕 Νέο</button>
                    </div>
                </div>
            </div>

            <div class="panel" style="margin-top:20px">
                <div class="route-header">
                    <h3>📚 Αποθηκευμένα Δρομολόγια</h3>
                    <button class="danger" onclick="clearAllRoutes()" style="padding:6px 12px;font-size:12px;">🗑️ Διαγραφή Όλων</button>
                </div> 
                <div id="savedRoutes"></div>
            </div>
        </div>

        <script src="dromologia.js"></script>
    </body>
</html>
