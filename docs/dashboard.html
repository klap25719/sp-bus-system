<!DOCTYPE html>
<html lang="el">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Saint-Paul | Dashboard</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="dashboard.css">
    </head>
 
    <body>

        <div id="sidebar" class="sidebar">
            <button id="close-btn" class="close-btn">&times;</button>
            <div id="dynamic-menu" class="menu-section">
                <h4 id="menu-title"></h4>
                <ul id="menu-list"></ul>
            </div>
            <hr style="border: 0.5px solid rgba(255,255,255,0.2); margin: 20px;">
            <div style="padding: 0 20px;">
                <a href="index.html" class="menu-item"><i class="fas fa-home"></i> Επιστροφή στην Αρχική</a>
            </div>
        </div>

        <button id="menu-toggle" class="menu-toggle"><i class="fas fa-bars"></i></button>

        <main id="main-content">
            <h2 style="color: #0047ab;" id="welcome-title">Πίνακας Διαχείρισης</h2>
            <div id="dynamic-content">
                <p>Επιλέξτε μια ενέργεια από το πλευρικό μενού για να συνεχίσετε.</p>
            </div>
        </main>

        <script src="dashboard.js"></script>
    </body>
</html>
